name: Challenge benchmark material validation
on:
  workflow_dispatch:
    inputs:
      test_key:
        description: Private material decryption key; never a model API key
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: doctor-challenge-materials
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mask private material key
        env:
          TEST_KEY: ${{ inputs.test_key }}
        run: echo "::add-mask::$TEST_KEY"
      - run: bash scripts/install-ci-sdk.sh "$RUNNER_TEMP/sdk"
      - name: Build trusted core and isolated SDK
        run: |
          source "$RUNNER_TEMP/sdk/cangjie/envsetup.sh"
          mkdir -p target/debug
          cjc -p src -o target/debug/doctor --diagnostic-format=noColor
          bash scripts/build-sandbox-image.sh "$RUNNER_TEMP/sdk/cangjie" "$RUNNER_TEMP/image.json"
          echo "DOCTOR_SANDBOX_IMAGE=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/image.json')).image")" >> "$GITHUB_ENV"
      - name: Verify all reference programs, original defects and isolated faults
        env:
          CHALLENGE_TEST_KEY: ${{ inputs.test_key }}
        run: |
          source "$RUNNER_TEMP/sdk/cangjie/envsetup.sh"
          node scripts/verify-challenge-materials.mjs "$DOCTOR_SANDBOX_IMAGE" target/debug/doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-materials
          path: runs/challenge-materials/
          retention-days: 30
